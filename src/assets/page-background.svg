<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2560"
  height="1440"
  viewBox="0 0 100 100"
  preserveAspectRatio="none"
  aria-hidden="true"
  focusable="false"
>
  <rect width="100" height="100" fill="#F8FAF7" />

  <!-- Viewport-anchored color washes. -->
  <path
    d="M0 0 H24 C25.5 8.5 23.2 17.5 17.2 22.5 C11.2 27.5 4.4 28.4 0 25.8 Z"
    fill="#DDECF7"
  />
  <path
    d="M100 100 H78.8 C77.5 91.5 79.7 82.2 85.8 76.9 C91.1 72.3 96.8 71.5 100 73.2 Z"
    fill="#DDEBDD"
  />

  <!-- Small feminine accent; decorative only. -->
  <svg x="84.5" y="7" width="6" height="6" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
    <circle cx="50" cy="50" r="42" fill="#F3DDE4" />
  </svg>

  <!-- Green botanical sprig, kept proportionate inside a responsive slot. -->
  <svg x="4.2" y="61.5" width="6.4" height="13.5" viewBox="0 0 70 76" preserveAspectRatio="xMidYMid meet" overflow="visible">
    <g fill="none" stroke="#356B52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <path d="M1 75 L69 1" />
      <ellipse cx="3" cy="54" rx="11" ry="6" transform="rotate(-24 3 54)" />
      <ellipse cx="33" cy="43" rx="11" ry="6" transform="rotate(27 33 43)" />
      <ellipse cx="25" cy="31" rx="11" ry="6" transform="rotate(-24 25 31)" />
      <ellipse cx="58" cy="19" rx="11" ry="6" transform="rotate(27 58 19)" />
      <ellipse cx="51" cy="8" rx="11" ry="6" transform="rotate(-24 51 8)" />
    </g>
  </svg>

  <!-- Blue botanical sprig, balanced against the green corner wash. -->
  <svg x="89.1" y="75.2" width="6.4" height="13.5" viewBox="0 0 70 76" preserveAspectRatio="xMidYMid meet" overflow="visible">
    <g fill="none" stroke="#285B92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <path d="M1 75 L69 1" />
      <ellipse cx="3" cy="54" rx="11" ry="6" transform="rotate(-24 3 54)" />
      <ellipse cx="33" cy="43" rx="11" ry="6" transform="rotate(27 33 43)" />
      <ellipse cx="25" cy="31" rx="11" ry="6" transform="rotate(-24 25 31)" />
      <ellipse cx="58" cy="19" rx="11" ry="6" transform="rotate(27 58 19)" />
      <ellipse cx="51" cy="8" rx="11" ry="6" transform="rotate(-24 51 8)" />
    </g>
  </svg>
</svg>
